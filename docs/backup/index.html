<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <link rel="stylesheet" href="./style.css" />
    <script src="./app.js" defer></script>
    <title>V2EX Lite Cloud Backup</title>
  </head>
  <body>
    <main>
      <h1>V2EX Lite <span data-message="backupCloud">Cloud backup</span></h1>
      <p data-message="backupToolHelp"></p>
      <label>
        <span data-message="backupMode">Backup method</span>
        <select id="provider">
          <option value="github">GitHub</option>
          <option value="webdav">WebDAV</option>
          <option value="drive">Google Drive</option>
        </select>
      </label>
      <section data-provider="github">
        <p data-message="backupGitHubHelp"></p>
        <label>
          <span data-message="backupRepository"></span>
          <input
            id="repository"
            placeholder="owner/private-repo"
            autocomplete="off"
            spellcheck="false"
          />
        </label>
        <label>
          <span data-message="backupToken"></span>
          <input id="github-token" type="password" autocomplete="off" />
        </label>
      </section>
      <section data-provider="webdav" hidden>
        <p data-message="backupWebDAVHelp"></p>
        <p data-message="backupWebDAVSetup"></p>
        <label>
          <span>WebDAV URL</span>
          <input
            id="webdav-url"
            type="url"
            placeholder="https://example.org/dav/v2ex-lite-backup.json"
            autocomplete="off"
          />
        </label>
        <label>
          <span data-message="backupUsername"></span>
          <input id="webdav-username" autocomplete="off" />
        </label>
        <label>
          <span data-message="backupPassword"></span>
          <input id="webdav-password" type="password" autocomplete="off" />
        </label>
      </section>
      <section data-provider="drive" hidden>
        <p data-message="backupDriveHelp"></p>
        <p data-message="backupGoogleSetup"></p>
        <label>
          <span>Google OAuth Client ID</span>
          <input id="google-client" autocomplete="off" spellcheck="false" />
        </label>
        <div class="actions">
          <button
            id="authorize"
            type="button"
            data-message="backupGoogleAuthorize"
            disabled
          ></button>
          <button id="list" type="button" data-message="backupGoogleList" disabled></button>
        </div>
        <label>
          <span data-message="backupGoogleFile"></span>
          <select id="drive-files"></select>
        </label>
      </section>
      <section>
        <label>
          <span data-message="selectBackup"></span>
          <input id="backup-file" type="file" accept=".json,application/json" />
        </label>
        <p id="capacity"></p>
        <div class="actions">
          <button id="upload" type="button" data-message="backupCloudUpload" disabled></button>
          <button id="download" type="button" data-message="backupCloudDownload" disabled></button>
        </div>
        <p id="status" role="status"></p>
      </section>
    </main>
  </body>
</html>
