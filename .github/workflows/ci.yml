name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: git diff --exit-code -- dist docs/backup/app.js
      - uses: actions/upload-artifact@v4
        if: matrix.node == 24
        with:
          name: v2ex-lite-userscript
          path: dist/
